[project]
name = "review-analyzer"
version = "0.1.0"
description = "ML-сервис для анализа тональности отзывов"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",

    "celery>=5.4.0",
    "redis>=5.0.0",

    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]