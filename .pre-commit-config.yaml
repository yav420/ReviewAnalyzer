repos:
  # Ruff — линтер и форматтер
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Mypy — проверка типов (через локальный venv, чтобы видеть зависимости)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --config-file=pyproject.toml
        language: system
        types: [python]
        exclude: ^(migrations/|tests/)

  # Commitizen — проверка формата коммит-сообщений
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]